apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: fake-api
  template:
    metadata:
      labels:
        app: fake-api
    spec:
      containers:
        - name: fake-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: REDIS_HOST
              value: {{ .Values.env.redisHost | quote }}